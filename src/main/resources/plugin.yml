name: AdvancedPlayerPings
version: '${version}'
main: me.stormizn.playerpings.PlayerPingsPlugin
api-version: '26.2'
authors: [stormizn]
description: Reports and remembers player pings in a local SQLite database.
website: https://github.com/stormizn/Advanced-Player-Pings

commands:
  ping:
    description: Shows a player's most recent ping and records it while they are online.
    usage: "<player>"

permissions:
  ping.use:
    description: Allows use of /ping <player>.
    default: true
  ping.reload:
    description: Allows /ping reload to re-read config.yml.
    default: op
